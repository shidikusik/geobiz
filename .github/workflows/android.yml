# SPDX-License-Identifier: MIT
# Builds the Android APK and AAB using Qt for Android (QtWebView backend).
name: android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Android (APK + AAB)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install desktop Qt (host tools for androiddeployqt/moc)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebview
          cache: true

      - name: Install Android Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtwebview
          cache: true

      - name: Install NDK + CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          echo "y" | sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure (Android arm64)
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: |
          $QT_ROOT_DIR/bin/qt-cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DQT_HOST_PATH="$QT_HOST_ROOT_DIR" \
            -DGEOBIZ_BUILD_TESTS=OFF

      - name: Build APK + AAB
        run: |
          cmake --build build-android
          # androiddeployqt outputs both the APK and the AAB bundle.
          cmake --build build-android --target apk
          cmake --build build-android --target aab || true

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: geobiz-android
          path: |
            build-android/**/*.apk
            build-android/**/*.aab
