# SPDX-License-Identifier: MIT
# Fast, dependency-light CI: builds and runs the pure C++23 core library tests.
# This gate runs on every push/PR and does not require Qt.
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core library tests (C++23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-13 cmake ninja-build

      - name: Configure (core + tests only, no Qt)
        run: |
          cmake -S . -B build-core -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEOBIZ_CORE_ONLY=ON
        # GEOBIZ_CORE_ONLY short-circuits the Qt app so the gate stays fast.

      - name: Build core tests
        run: cmake --build build-core --target geobiz_core_tests

      - name: Run tests
        run: ctest --test-dir build-core --output-on-failure
