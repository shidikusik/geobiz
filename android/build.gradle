// SPDX-License-Identifier: MIT
// Gradle build script template for the Qt-for-Android package.
// androiddeployqt merges this with the generated project; keep it aligned with
// the Qt version used in CI (see .github/workflows/android.yml).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'

android {
    namespace 'uz.geobiz.app'
    compileSdkVersion androidCompileSdkVersion.toInteger()
    ndkVersion androidNdkVersion

    defaultConfig {
        applicationId 'uz.geobiz.app'
        minSdkVersion qtMinSdkVersion.toInteger()
        targetSdkVersion qtTargetSdkVersion.toInteger()
        versionCode 1
        versionName '1.0.0'
    }

    // Qt provides the sources/resources through the generated variables below.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            // Populated by CI from secrets for signed AAB/APK builds.
            // storeFile file(System.getenv('GEOBIZ_KEYSTORE') ?: 'release.keystore')
            // storePassword System.getenv('GEOBIZ_KEYSTORE_PASSWORD')
            // keyAlias System.getenv('GEOBIZ_KEY_ALIAS')
            // keyPassword System.getenv('GEOBIZ_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
